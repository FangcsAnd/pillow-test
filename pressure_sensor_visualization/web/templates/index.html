<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>枕头压力测试系统</title>
<style>
:root {
  --bg: #f5f7fa; --card: #fff; --input: #f0f2f5; --accent: #3a86ff;
  --accent-hover: #5c9dff; --text: #2d3436; --text2: #636e72;
  --border: #dfe6e9; --success: #00b894; --danger: #d63031; --radius: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font: 13px "PingFang SC","Microsoft YaHei",sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; }
#sidebar { width: 340px; padding: 8px; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; border-right: 1px solid var(--border); flex-shrink: 0; }
.main { flex: 1; display: flex; flex-direction: column; padding: 10px; overflow: hidden; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; }
.card-title { font-weight: 700; color: var(--accent); margin-bottom: 6px; font-size: 13px; }
.row { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.row label { color: var(--text2); font-size: 12px; min-width: 70px; text-align: right; }
input, select, button { font: inherit; border-radius: 5px; border: 1px solid var(--border); padding: 5px 8px; background: var(--input); color: var(--text); outline: none; }
input:focus, select:focus { border-color: var(--accent); }
button { cursor: pointer; font-weight: 600; border: none; padding: 7px 14px; color: #fff; }
input[readonly] { background: #f8f9fb; color: var(--text2); }
.btn-connect { background: var(--success); }
.btn-connect:hover { background: #00d2a4; }
.btn-connect.active { background: var(--danger); }
.btn-connect.active:hover { background: #e74c3c; }
.btn-primary { background: var(--accent); }
.btn-primary:hover { background: var(--accent-hover); }
.btn-sm { padding: 3px 8px; font-size: 11px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
input[type="range"] { -webkit-appearance: none; height: 5px; border-radius: 3px; background: var(--input); flex: 1; border: none; padding: 0; }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); cursor: pointer; }
input[type="checkbox"] { width: 14px; height: 14px; accent-color: var(--accent); }
.param-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 8px; }
.param-item { display: flex; align-items: center; font-size: 11px; }
.param-item .pn { color: var(--text2); min-width: 68px; }
.param-item .pv { color: var(--accent); font-weight: 700; }
.param-item .help { display: inline-flex; align-items: center; justify-content: center; width: 15px; height: 15px; border-radius: 50%; background: #dfe6e9; color: #636e72; font-size: 9px; cursor: pointer; border: none; margin-right: 2px; }
.status { font-size: 11px; color: var(--text2); padding: 6px 8px; background: var(--input); border-radius: 5px; }
.status.connected { color: var(--success); }
.comfort-val { font-size: 10px; color: var(--accent); font-weight: 700; min-width: 16px; text-align: center; }
.history-row:hover { background: #e8f4fc; cursor: pointer; }
#historyCards { display: flex; gap: 6px; overflow-x: auto; padding: 6px; flex-shrink: 0; border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); }
.history-row { flex-shrink: 0; width: 140px; padding: 8px 10px; font-size: 11px; border-radius: 6px; cursor: pointer; color: #fff; display: flex; flex-direction: column; gap: 2px; }
.history-row:hover { opacity: 0.85; }
.history-row.active { box-shadow: 0 0 0 2px var(--accent), 0 2px 8px rgba(0,0,0,0.2); }
.history-row .hscore { font-size: 24px; font-weight: 700; }
.history-row .hsub { font-size: 10px; opacity: 0.9; }
.history-row.good { background: linear-gradient(135deg, #00b894, #00d2a4); }
.history-row.ok { background: linear-gradient(135deg, #fdcb6e, #e17055); }
.history-row.bad { background: linear-gradient(135deg, #d63031, #e17055); }
#historyCards::-webkit-scrollbar { height: 4px; }
#historyCards::-webkit-scrollbar-track { background: var(--input); border-radius: 2px; }
#historyCards::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
#heatmapWrap { flex: 1; display: flex; align-items: center; justify-content: center; }
#heatmap { border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); width: 560px; height: 560px; }
</style>
</head>
<body>
<div id="sidebar">
  <div class="card">
    <div class="card-title">串口设置</div>
    <div class="row"><label>端口:</label><select id="portSelect"></select><button class="btn-sm" style="background:var(--input);color:var(--text);border:1px solid var(--border);" onclick="refreshPorts()">刷新</button></div>
    <div class="row"><label>波特率:</label><select id="baudSelect"><option>460800</option><option>115200</option><option>57600</option><option>38400</option><option>19200</option></select></div>
    <button id="connectBtn" class="btn-connect" style="width:100%;padding:10px;" onclick="toggleConnect()">连接</button>
  </div>

  <div class="card">
    <div class="card-title">显示设置</div>
    <div style="display:flex;gap:12px;align-items:center;">
      <label style="display:flex;align-items:center;gap:4px;cursor:pointer;color:var(--text2);font-size:12px;"><input type="checkbox" id="smooth" checked onchange="onSmoothChange()">平滑</label>
      <label style="display:flex;align-items:center;gap:4px;cursor:pointer;color:var(--text2);font-size:12px;"><input type="checkbox" id="showVals" checked>数值</label>
      <span style="font-size:10px;color:var(--text2);">系数</span>
      <input type="range" id="smoothRange" min="1" max="100" value="30" oninput="onSmoothRange()" style="width:60px;">
      <span id="smoothVal" style="font-size:10px;color:var(--accent);min-width:25px;">30%</span>
    </div>
  </div>

  <div class="card">
    <div class="card-title">枕头测试参数</div>
    <div class="param-grid" id="paramsGrid"></div>
  </div>

  <div class="card">
    <div class="card-title">被试信息</div>
    <div class="row"><label>被试ID:</label><select id="recUserId" style="flex:1" onchange="onUserSelect()"><option value="">自定义</option></select></div>
    <div class="row"><label>姓名:</label><input style="flex:1" id="recName" readonly></div>
    <div class="row"><label>性别:</label><input style="flex:1" id="recGender" readonly></div>
    <div class="row"><label>年龄:</label><input style="flex:1" id="recAge" readonly><span style="font-size:10px;color:var(--text2);">岁</span></div>
    <div class="row"><label>身高:</label><input style="flex:1" id="recHeight" readonly><span style="font-size:10px;color:var(--text2);">cm</span></div>
    <div class="row"><label>体重:</label><input style="flex:1" id="recWeight" readonly><span style="font-size:10px;color:var(--text2);">kg</span></div>
    <div class="row"><label>肩宽:</label><input style="flex:1" id="recShoulder" readonly><span style="font-size:10px;color:var(--text2);">cm</span></div>
    <div class="row"><label>颈曲:</label><canvas id="neckCurveChart" width="90" height="180" style="border:1px solid var(--border);border-radius:4px;background:#fff;margin-left:4px;"></canvas></div>
    <div class="row"><label>病史:</label><input style="flex:1" id="recNeckHistory" readonly></div>
    <div class="row"><label>颈痛:</label><input style="flex:1" id="recNeckPain" readonly></div>
  </div>

  <div class="card">
    <div class="card-title">枕头信息</div>
    <div class="row"><label>枕头ID:</label><select id="recPillowId" style="flex:1" onchange="onPillowSelect()"><option value="">自定义</option></select></div>
    <div class="row"><label>品牌:</label><input style="flex:1" id="recBrand" readonly></div>
    <div class="row"><label>材质:</label><input style="flex:1" id="recMaterial" readonly></div>
    <div class="row"><label>尺寸:</label><input style="flex:1" id="recPillowSize" readonly><span style="font-size:10px;color:var(--text2);">mm</span></div>
    <div class="row"><label>后脑勺高:</label><input style="flex:1" id="recHeadHeight" readonly><span style="font-size:10px;color:var(--text2);">mm</span></div>
    <div class="row"><label>颈椎高:</label><input style="flex:1" id="recNeckHeight" readonly><span style="font-size:10px;color:var(--text2);">mm</span></div>
    <div class="row"><label>侧睡高:</label><input style="flex:1" id="recSideHeight" readonly><span style="font-size:10px;color:var(--text2);">mm</span></div>
    <div class="row"><label>中心硬度:</label><input style="flex:1" id="recCenterHardness" readonly><span style="font-size:10px;color:var(--text2);">HF</span></div>
    <div class="row"><label>颈椎硬度:</label><input style="flex:1" id="recNeckHardness" readonly><span style="font-size:10px;color:var(--text2);">HF</span></div>
    <div class="row"><label>左硬度:</label><input style="flex:1" id="recEdgeHardnessL" readonly><span style="font-size:10px;color:var(--text2);">HF</span></div>
    <div class="row"><label>右硬度:</label><input style="flex:1" id="recEdgeHardnessR" readonly><span style="font-size:10px;color:var(--text2);">HF</span></div>
  </div>

  <div class="card">
    <div class="card-title">舒适度评价</div>
    <div class="row"><label>整体(-10~10):</label><input type="range" id="comfort_overall" min="-10" max="10" value="0" oninput="updateComfortTotal()"><span class="comfort-val" id="comfortOverallVal">0</span></div>
    <div class="row"><label>仰睡(-10~10):</label><input type="range" id="comfort_supine" min="-10" max="10" value="0" oninput="updateComfortTotal()"><span class="comfort-val" id="comfortSupineVal">0</span></div>
    <div class="row"><label>侧睡(-10~10):</label><input type="range" id="comfort_side" min="-10" max="10" value="0" oninput="updateComfortTotal()"><span class="comfort-val" id="comfortSideVal">0</span></div>
    <div class="row"><label>颈部支撑:</label><input type="range" id="comfort_neck" min="-10" max="10" value="0" oninput="updateComfortTotal()"><span class="comfort-val" id="comfortNeckVal">0</span></div>
    <div class="row"><label>头部包裹:</label><input type="range" id="comfort_head" min="-10" max="10" value="0" oninput="updateComfortTotal()"><span class="comfort-val" id="comfortHeadVal">0</span></div>
    <div class="row"><label>压力均匀:</label><input type="range" id="comfort_even" min="-10" max="10" value="0" oninput="updateComfortTotal()"><span class="comfort-val" id="comfortEvenVal">0</span></div>
    <div class="row"><label>入睡容易:</label><input type="range" id="comfort_fall" min="-10" max="10" value="0" oninput="updateComfortTotal()"><span class="comfort-val" id="comfortFallVal">0</span></div>
    <div class="row"><label>翻身顺畅:</label><input type="range" id="comfort_turn" min="-10" max="10" value="0" oninput="updateComfortTotal()"><span class="comfort-val" id="comfortTurnVal">0</span></div>
    <div class="row"><label>压迫感:</label><input type="range" id="comfort_pressure" min="-10" max="10" value="0" oninput="updateComfortTotal()"><span class="comfort-val" id="comfortPressureVal">0</span></div>
    <div class="row"><label>闷热感:</label><input type="range" id="comfort_heat" min="-10" max="10" value="0" oninput="updateComfortTotal()"><span class="comfort-val" id="comfortHeatVal">0</span></div>
    <div class="row"><label style="font-weight:700;color:var(--accent);">综合:</label><span id="comfortTotal" style="font-size:18px;font-weight:700;color:var(--accent);">0</span></div>
  </div>

  <div class="card">
    <div class="card-title">测试记录</div>
    <div class="row"><label>睡姿:</label><select id="recSleepPos" style="flex:1"><option>仰睡</option><option>侧睡</option></select></div>
    <div class="row"><label>备注:</label><input style="flex:1" id="recNote" placeholder="可选填"></div>
    <div style="display:flex;gap:6px;">
      <button id="recordBtn" class="btn-primary" style="flex:1;padding:10px;" onclick="recordData()" disabled>记录数据</button>
      <button class="btn-primary" style="padding:10px;" onclick="exportData()">导出</button>
    </div>
  </div>

  <div class="status" id="status">未连接</div>
</div>

<div class="main">
  <div style="font-weight:700;color:var(--accent);font-size:13px;margin-bottom:4px;display:flex;align-items:center;gap:8px;">历史记录 <span id="historyCount" style="color:var(--text2);font-size:11px;">0</span>条 <button class="btn-sm" onclick="refreshHistory()" style="background:var(--accent);font-size:10px;">刷新</button> <button class="btn-sm" onclick="resetToTest()" style="background:var(--success);font-size:10px;">新测试</button></div>
  <div id="historyCards"></div>
  <div id="heatmapWrap"><canvas id="heatmap" width="500" height="500"></canvas></div>
</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
const SIZE = 16;
let socket = io();
let currentGrid = Array.from({length: SIZE}, () => Array(SIZE).fill(0));
let smooth = true, smoothFactor = 0.3, showValues = true, isConnected = false;
let recording = false, recordCountdown = 0, recordTimer = null, allRecords = [];
let pillowData = [], userData = [];
let currentNeckCurve = '[]';
const canvas = document.getElementById('heatmap');
const ctx = canvas.getContext('2d');

function getColor(v) {
  v = Math.max(0, Math.min(255, v)); let r, g, b;
  if (v < 64) { r = Math.round(220 + 35*v/63); g = Math.round(230 + 25*v/63); b = Math.round(245 - 235*v/63); }
  else if (v < 128) { let t = (v-64)/63; r = Math.round(255-137*t); g = Math.round(255-73*t); b = Math.round(10+100*t); }
  else if (v < 192) { let t = (v-128)/63; r = Math.round(118+137*t); g = Math.round(182-182*t); b = Math.round(110-110*t); }
  else { let t = (v-192)/63; r = 255; g = Math.round(0+40*t); b = Math.round(0+80*t); }
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

function drawHeatmap(data) {
  let size = 560;
  canvas.width = size;
  canvas.height = size;
  let m = 12, gs = 500, ox = (size - gs)/2, oy = 16;
  let cs = gs / SIZE;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (let i = 0; i < SIZE; i++)
    for (let j = 0; j < SIZE; j++) {
      ctx.fillStyle = getColor(Math.round(data[i][j]));
      ctx.fillRect(ox + j*cs, oy + i*cs, cs-1, cs-1);
    }
  ctx.strokeStyle = 'rgba(180,190,200,0.3)'; ctx.lineWidth = 0.5;
  for (let i = 0; i <= SIZE; i++) {
    let x = ox + i*cs, y = oy + i*cs;
    ctx.beginPath(); ctx.moveTo(x, oy); ctx.lineTo(x, oy + gs); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ox, y); ctx.lineTo(ox + gs, y); ctx.stroke();
  }
  let headY = oy + gs*10/SIZE, neckY = oy + gs*13/SIZE;
  ctx.strokeStyle = 'rgba(116,185,255,0.5)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(ox, headY); ctx.lineTo(ox + gs, headY); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,118,117,0.5)';
  ctx.beginPath(); ctx.moveTo(ox, neckY); ctx.lineTo(ox + gs, neckY); ctx.stroke();
  ctx.font = 'bold 10px "PingFang SC"';
  ctx.fillStyle = 'rgba(116,185,255,0.8)'; ctx.fillText('头', ox+3, oy+11);
  ctx.fillStyle = 'rgba(255,118,117,0.8)'; ctx.fillText('颈', ox+3, headY+11);
  ctx.fillText('肩', ox+3, neckY+11);
  if (showValues && cs >= 18) {
    let fs = Math.max(7, Math.min(Math.floor(cs*0.35), 12));
    ctx.font = 'bold ' + fs + 'px "PingFang SC"';
    for (let i = 0; i < SIZE; i++)
      for (let j = 0; j < SIZE; j++) {
        let val = Math.round(data[i][j]); if (val < 5) continue;
        ctx.fillStyle = val > 128 ? 'rgba(255,255,255,0.9)' : 'rgba(30,30,30,0.8)';
        ctx.fillText(val, ox + j*cs + 2, oy + i*cs + cs*0.6);
      }
  }
  let ly = oy + gs + 10;
  for (let i = 0; i < gs; i++) { ctx.fillStyle = getColor(Math.floor(i*255/gs)); ctx.fillRect(ox+i, ly, 1, 10); }
  ctx.font = '9px "PingFang SC"'; ctx.fillStyle = '#636e72';
  ctx.fillText('0', ox, ly + 22); ctx.fillText('255', ox + gs - 20, ly + 22);
}

socket.on('sensor_data', function(msg) {
  if (smooth) { for (let i = 0; i < SIZE; i++) for (let j = 0; j < SIZE; j++) currentGrid[i][j] = Math.round(currentGrid[i][j]*(1-smoothFactor) + msg.grid[i][j]*smoothFactor); }
  else currentGrid = msg.grid;
  drawHeatmap(currentGrid);
  updateParams(msg.params);
});

const paramHelps = {
  '最大压力:': '传感器检测到的最大压力值(0-255)', '平均压力:': '所有接触点压力的平均值',
  '接触面积:': '有压力触发的传感器点占比', '均匀度:': '压力分布标准差，越小越均匀',
  '峰值位置:': '压力最大点的X,Y坐标', '峰值压力:': '局部压力峰值，越高越硌',
  '压力集中指数:': '压力集中程度，越高越不适', '95百分位压力:': '判断局部会不会压得疼、血液循环受阻',
  '压力梯度:': '相邻点压力差均值，反映陡峭度', '头部承力:': '头部区域(0-10行)占总压力比',
  '颈椎承力:': '颈椎区域(10-13行)占总压力比', '肩膀承力:': '肩膀区域(13-16行)占总压力比',
  '颈部连续性:': '颈部区域压力标准差，越小越均匀', '颈部空隙:': '检测颈部是否有低压力区域',
  '压力中心:': '压力中心的X,Y坐标位置(%)',
};

function updateParams(params) {
  let map = [
    ['max','最大压力:',params.max],['avg','平均压力:',params.avg],['area','接触面积:',params.area+'%'],
    ['std','均匀度:',params.std],['peak_pos','峰值位置:',params.peak_pos],['peak_val','峰值压力:',params.peak_val],
    ['concentration','压力集中指数:',params.concentration],['p95','95百分位压力:',params.p95],
    ['gradient','压力梯度:',params.gradient],['head_ratio','头部承力:',params.head_ratio+'%'],
    ['neck_ratio','颈椎承力:',params.neck_ratio+'%'],['shoulder_ratio','肩膀承力:',params.shoulder_ratio+'%'],
    ['neck_continuity','颈部连续性:',params.neck_continuity],['neck_gap','颈部空隙:',params.neck_gap],
    ['center','压力中心:',params.center],
  ];
  map.forEach(function(m) { var el = document.getElementById('pv_'+m[0]); if (el) el.textContent = typeof m[2]==='number' ? Math.round(m[2]) : m[2]; });
}

function buildParamGrid() {
  var items = [
    ['max','最大压力:'],['avg','平均压力:'],['area','接触面积:'],['std','均匀度:'],
    ['peak_pos','峰值位置:'],['peak_val','峰值压力:'],['concentration','压力集中指数:'],
    ['p95','95百分位压力:'],['gradient','压力梯度:'],['head_ratio','头部承力:'],
    ['neck_ratio','颈椎承力:'],['shoulder_ratio','肩膀承力:'],['neck_continuity','颈部连续性:'],
    ['neck_gap','颈部空隙:'],['center','压力中心:'],
  ];
  var html = '';
  items.forEach(function(m) {
    var tip = paramHelps[m[1]] || '';
    html += '<div class="param-item"><button class="help" onclick="alert(this.parentElement.querySelector(\'.pn\').textContent.replace(\':\',\'\'))">?</button><span class="pn">'+m[1]+'</span><span class="pv" id="pv_'+m[0]+'">0</span></div>';
  });
  document.getElementById('paramsGrid').innerHTML = html;
}
buildParamGrid();

async function refreshPorts() {
  var r = await fetch('/api/ports'); var d = await r.json();
  document.getElementById('portSelect').innerHTML = d.ports.map(function(p) { return '<option>'+p+'</option>'; }).join('');
}

async function toggleConnect() {
  var btn = document.getElementById('connectBtn');
  if (isConnected) {
    await fetch('/api/disconnect', {method:'POST'});
    btn.textContent = '连接'; btn.classList.remove('active'); isConnected = false;
    document.getElementById('status').textContent = '未连接'; document.getElementById('status').classList.remove('connected');
    document.getElementById('recordBtn').disabled = true;
  } else {
    var port = document.getElementById('portSelect').value, baud = document.getElementById('baudSelect').value;
    await fetch('/api/connect', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({port:port, baudrate:baud})});
    btn.textContent = '断开'; btn.classList.add('active'); isConnected = true;
    document.getElementById('status').textContent = '已连接 '+port+' @ '+baud;
    document.getElementById('status').classList.add('connected');
    document.getElementById('recordBtn').disabled = false;
  }
}

function onSmoothChange() { smooth = document.getElementById('smooth').checked; }
function onSmoothRange() { smoothFactor = document.getElementById('smoothRange').value/100; document.getElementById('smoothVal').textContent = document.getElementById('smoothRange').value + '%'; }
document.getElementById('showVals').addEventListener('change', function(){ showValues = this.checked; drawHeatmap(currentGrid); });

async function loadPillows() {
  var r = await fetch('/api/pillows'); var d = await r.json();
  pillowData = d.pillows || [];
  var sel = document.getElementById('recPillowId');
  pillowData.forEach(function(p) { var o = document.createElement('option'); o.value = p.id; o.textContent = p.id + ' - ' + p.brand; sel.appendChild(o); });
}

async function loadUsers() {
  var r = await fetch('/api/users'); var d = await r.json();
  userData = d.users || [];
  var sel = document.getElementById('recUserId');
  userData.forEach(function(u) { var o = document.createElement('option'); o.value = u.id; o.textContent = u.id + ' - ' + u.name; sel.appendChild(o); });
}

function onUserSelect() {

function drawNeckCurve(data) {
  var canvas = document.getElementById('neckCurveChart');
  var ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (!data || data.length < 2) return;
  var w = canvas.width - 20, h = canvas.height - 20, ox = 18, oy = 4;
  var maxVal = Math.max.apply(null, data);
  if (maxVal === 0) return;
  ctx.font = '8px "PingFang SC"'; ctx.fillStyle = '#636e72'; ctx.strokeStyle = '#dfe6e9'; ctx.lineWidth = 0.5;
  var stepY = h / (data.length - 1);
  for (var i = 0; i < data.length; i += Math.max(1, Math.floor(data.length/5))) {
    var y = oy + i*stepY;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
    ctx.fillText('C'+(i+1), 2, y+3);
  }
  for (var t = 0; t <= 4; t++) {
    var v = Math.round(maxVal*t/4);
    var x = ox + (w*(4-t)/4);
    ctx.beginPath(); ctx.moveTo(x, oy); ctx.lineTo(x, oy+h); ctx.stroke();
    ctx.fillText(v, x-6, oy+h+8);
  }
  ctx.strokeStyle = '#3a86ff'; ctx.lineWidth = 1.5; ctx.beginPath();
  data.forEach(function(v, i) {
    var x = ox + w - (v/maxVal)*w, y = oy + i*stepY;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();
  ctx.fillStyle = 'rgba(58,134,255,0.12)'; ctx.beginPath();
  ctx.moveTo(ox+w, oy);
  data.forEach(function(v, i) { ctx.lineTo(ox+w - (v/maxVal)*w, oy + i*stepY); });
  ctx.lineTo(ox+w, oy+h); ctx.closePath(); ctx.fill();
}

function updateComfortTotal() {
  var w = { overall:20, neck:15, head:10, supine:15, side:15, even:5, fall:5, turn:5, pressure:-5, heat:-5 };
  var ids = { overall:'comfort_overall', neck:'comfort_neck', head:'comfort_head', supine:'comfort_supine', side:'comfort_side', even:'comfort_even', fall:'comfort_fall', turn:'comfort_turn', pressure:'comfort_pressure', heat:'comfort_heat' };
  var vids = { overall:'comfortOverallVal', neck:'comfortNeckVal', head:'comfortHeadVal', supine:'comfortSupineVal', side:'comfortSideVal', even:'comfortEvenVal', fall:'comfortFallVal', turn:'comfortTurnVal', pressure:'comfortPressureVal', heat:'comfortHeatVal' };
  var total = 0, tw = 0;
  for (var k in w) {
    var v = parseInt(document.getElementById(ids[k]).value);
    document.getElementById(vids[k]).textContent = v;
    total += v * w[k]; tw += Math.abs(w[k]);
  }
  document.getElementById('comfortTotal').textContent = tw > 0 ? Math.round(total/tw) : 0;
}

function loadHistory() {
  var xhr = new XMLHttpRequest();
  xhr.open('GET', '/api/history', true);
  xhr.onload = function() {
    try {
      var records = JSON.parse(xhr.responseText).history || [];
      window._historyRecords = records;
      var html = '';
      records.slice().reverse().forEach(function(r, idx) {
        var c = r.comfort || {};
        var score = parseInt(c.comfort_total) || 0;
        var cls = score >= 6 ? 'good' : (score >= 3 ? 'ok' : 'bad');
        html += '<div class="history-row ' + cls + '" onclick="showDetail(' + idx + ')">';
        html += '<div style="font-size:9px;opacity:0.8;">' + (r.time||'') + '</div>';
        html += '<div style="font-size:10px;font-weight:600;">' + (r.user_id||'') + ' ' + (r.name||'') + '</div>';
        html += '<div class="hscore">' + (c.comfort_total||'?') + '</div>';
        html += '<div style="font-size:9px;">' + (r.pillow_id||'') + ' ' + (r.sleep_pos||'') + '</div>';
        html += '<div class="hsub">仰' + (c.comfort_supine||0) + ' 侧' + (c.comfort_side||0) + ' 撑' + (c.comfort_neck||0) + '</div>';
        html += '<div class="hsub">包' + (c.comfort_head||0) + ' 压' + (c.comfort_pressure||0) + ' 热' + (c.comfort_heat||0) + '</div>';
        html += '</div>';
      });
      document.getElementById('historyCards').innerHTML = html;
      document.getElementById('historyCount').textContent = records.length;
    } catch(e) { document.getElementById('historyCards').innerHTML = '加载失败'; }
  };
  xhr.send();
}

  });

  try { drawHeatmap(JSON.parse(r.avg_grid||'[]')); } catch(e) { drawHeatmap(currentGrid); }

  document.querySelectorAll('#historyCards .history-row').forEach(function(c, i) { if (i === idx) c.classList.add('active'); else c.classList.remove('active'); });

async function exportData() {
  if (allRecords.length === 0) { alert('暂无记录'); return; }
  await fetch('/api/save', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({records:allRecords})});
  var r = await fetch('/api/export', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({records:allRecords})});
  var d = await r.json();
  if (d.status === 'ok') alert('已导出 '+d.count+' 条记录');
  else alert('导出失败: '+d.message);
}
